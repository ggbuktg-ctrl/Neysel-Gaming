<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09051b">
  <title>NeySel • Gaming Hub</title>
  <style>
    :root {
      --bg: #080516; --panel: rgba(17, 10, 42, .88);
      --purple: #a855f7; --blue: #38bdf8; --text: #f7f3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 5%, rgba(139,92,246,.28), transparent 34rem),
        radial-gradient(circle at 90% 35%, rgba(37,99,235,.2), transparent 30rem),
        var(--bg);
    }
    .wrap { width: min(100% - 28px, 980px); margin: 26px auto 48px; }
    .poster {
      display: block; width: 100%; height: auto; border-radius: 22px;
      border: 1px solid rgba(192,132,252,.6);
      box-shadow: 0 0 34px rgba(147,51,234,.28), 0 18px 60px #0009;
    }
    .content {
      margin-top: 22px; padding: clamp(20px, 4vw, 34px);
      border: 1px solid rgba(168,85,247,.65); border-radius: 22px;
      background: linear-gradient(145deg, rgba(33,15,68,.94), var(--panel));
      box-shadow: 0 0 28px rgba(124,58,237,.18);
    }
    .eyebrow {
      margin: 0 0 10px; color: #c4b5fd; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase; font-size: .78rem;
    }
    h1 {
      margin: 0 0 22px; font-size: clamp(1.35rem, 4vw, 2.1rem);
      line-height: 1.25; text-align: center;
      background: linear-gradient(90deg, #fff, #d8b4fe, #7dd3fc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .services { display: grid; gap: 12px; }
    .service {
      display: flex; gap: 13px; align-items: flex-start;
      padding: 15px 16px; border-radius: 14px;
      background: linear-gradient(110deg, rgba(126,34,206,.22), rgba(30,64,175,.15));
      border: 1px solid rgba(167,139,250,.28);
      font-size: clamp(.94rem, 2.5vw, 1.06rem); line-height: 1.5;
    }
    .service .mark { color: #67e8f9; font-weight: 900; flex: 0 0 auto; }
    .service strong { color: #fff; }
    .zalo-link {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 16px; padding: 15px 18px; border-radius: 14px;
      color: #fff; text-decoration: none; font-weight: 850;
      background: linear-gradient(100deg, #087cf0, #1557c0);
      border: 1px solid rgba(125,211,252,.7);
      box-shadow: 0 0 22px rgba(37,99,235,.28);
      transition: transform .18s ease, filter .18s ease;
    }
    .zalo-link:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .zalo-link:focus-visible { outline: 3px solid #bae6fd; outline-offset: 3px; }
    .contact {
      margin-top: 22px; padding: 18px; text-align: center;
      border-radius: 16px; border: 1px solid rgba(56,189,248,.5);
      background: linear-gradient(100deg, rgba(126,34,206,.28), rgba(37,99,235,.22));
      font-weight: 800; line-height: 1.55;
    }
    .heart { color: #fb7185; }
    footer { text-align: center; color: #a99cbd; font-size: .82rem; margin-top: 16px; }
    @media (min-width: 760px) {
      .services { grid-template-columns: 1fr 1fr; }
      .service:last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
